name: Deploy to GitHub Pages

# This workflow is OPTIONAL. The site is served directly from the `main`
# branch via Pages "Deploy from a branch". This workflow is kept for users who
# prefer the GitHub Actions deploy source; run it manually from the Actions tab.
# (It requires repo Settings > Actions > General > Workflow permissions set to
# "Read and write permissions" so it can enable/deploy Pages.)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
